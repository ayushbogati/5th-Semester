<!DOCTYPE html>
<html>
<head>
    <title>Fibonacci Series</title>
</head>
<body>

<h2>Fibonacci Series using Arrow Function</h2>

<label>Enter number of terms:</label>
<input type="number" id="num" min="1">
<button onclick="showFibonacci()">Generate</button>

<p id="output"></p>

<script>
    // Arrow function to generate Fibonacci series
    const generateFibonacci = (n) => {
        let fib = [0, 1];

        for (let i = 2; i < n; i++) {
            fib[i] = fib[i - 1] + fib[i - 2];
        }

        return fib.slice(0, n); // ensures correct length if n < 2
    };

    function showFibonacci() {
        const n = parseInt(document.getElementById("num").value);

        if (n <= 0 || isNaN(n)) {
            document.getElementById("output").innerText =
                "Please enter a valid positive number.";
            return;
        }

        const result = generateFibonacci(n);
        document.getElementById("output").innerText =
            "Fibonacci Series: " + result.join(", ");
    }
</script>

</body>
</html>
